<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090E1A"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101B2D"/>
      <stop offset="1" stop-color="#0D1526"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="smallGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <g opacity="0.18">
    <path d="M0 80H1600" stroke="#CBD5E1"/>
    <path d="M0 160H1600" stroke="#CBD5E1"/>
    <path d="M0 240H1600" stroke="#CBD5E1"/>
    <path d="M0 320H1600" stroke="#CBD5E1"/>
    <path d="M0 400H1600" stroke="#CBD5E1"/>
    <path d="M0 480H1600" stroke="#CBD5E1"/>
    <path d="M0 560H1600" stroke="#CBD5E1"/>
    <path d="M0 640H1600" stroke="#CBD5E1"/>
    <path d="M0 720H1600" stroke="#CBD5E1"/>
    <path d="M0 800H1600" stroke="#CBD5E1"/>
    <path d="M160 0V900" stroke="#CBD5E1"/>
    <path d="M320 0V900" stroke="#CBD5E1"/>
    <path d="M480 0V900" stroke="#CBD5E1"/>
    <path d="M640 0V900" stroke="#CBD5E1"/>
    <path d="M800 0V900" stroke="#CBD5E1"/>
    <path d="M960 0V900" stroke="#CBD5E1"/>
    <path d="M1120 0V900" stroke="#CBD5E1"/>
    <path d="M1280 0V900" stroke="#CBD5E1"/>
    <path d="M1440 0V900" stroke="#CBD5E1"/>
  </g>

  <g filter="url(#softGlow)">
    <circle cx="250" cy="150" r="160" fill="#14B8A6" opacity="0.08"/>
    <circle cx="800" cy="150" r="180" fill="#60A5FA" opacity="0.08"/>
    <circle cx="1320" cy="150" r="170" fill="#A78BFA" opacity="0.08"/>
  </g>

  <g>
    <text x="800" y="110" text-anchor="middle" fill="#E2E8F0" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700">Zero-config</text>
    <text x="800" y="158" text-anchor="middle" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="22">No setup friction. Just connect and route.</text>
  </g>

  <g>
    <rect x="120" y="220" width="350" height="240" rx="28" fill="url(#card)" stroke="rgba(45,212,191,0.55)"/>
    <rect x="620" y="220" width="350" height="240" rx="28" fill="url(#card)" stroke="rgba(96,165,250,0.55)"/>
    <rect x="1120" y="220" width="350" height="240" rx="28" fill="url(#card)" stroke="rgba(167,139,250,0.55)"/>
  </g>

  <g>
    <circle cx="180" cy="282" r="36" fill="#14B8A6" opacity="0.14"/>
    <circle cx="680" cy="282" r="36" fill="#60A5FA" opacity="0.14"/>
    <circle cx="1180" cy="282" r="36" fill="#A78BFA" opacity="0.14"/>

    <text x="180" y="293" text-anchor="middle" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">1</text>
    <text x="680" y="293" text-anchor="middle" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">2</text>
    <text x="1180" y="293" text-anchor="middle" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">3</text>
  </g>

  <g>
    <text x="250" y="370" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600">Install</text>
    <text x="250" y="410" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="20">npm i -g omniroute</text>
    <text x="250" y="448" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="20">Start service locally</text>

    <text x="750" y="370" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600">Connect</text>
    <text x="750" y="410" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="20">Use your provider account</text>
    <text x="750" y="448" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="20">Or API key</text>

    <text x="1250" y="370" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600">Use</text>
    <text x="1250" y="410" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="20">Eligible routes auto-select</text>
    <text x="1250" y="448" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="20">without manual config</text>
  </g>

  <g opacity="0.9">
    <path d="M470 340H620" stroke="#94A3B8" stroke-width="4" stroke-dasharray="12 12"/>
    <path d="M970 340H1120" stroke="#94A3B8" stroke-width="4" stroke-dasharray="12 12"/>
    <circle cx="520" cy="340" r="6" fill="#2DD4BF" filter="url(#smallGlow)"/>
    <circle cx="1020" cy="340" r="6" fill="#60A5FA" filter="url(#smallGlow)"/>
  </g>

  <g fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700">
    <text x="800" y="610" text-anchor="middle">Works zero-config</text>
  </g>

  <g fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="24">
    <text x="800" y="660" text-anchor="middle">Connect, then route</text>
  </g>
</svg>
